    <style type="text/tailwindcss">
        body {
  animation: page-enter 200ms ease;
}

.page-exit {
  animation: page-exit 200ms ease forwards;
}

@keyframes page-enter {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes page-exit {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-8px); }
}

        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .ios-bottom-safe {
            padding-bottom: calc(env(safe-area-inset-bottom) + 16px);
        }
        .custom-radio:checked + .radio-card {
            border-color: #5B55C8;
            background-color: rgba(91, 85, 200, 0.02);

        .custom-radio:checked + .radio-card .radio-indicator {
            border-color: #5B55C8;
            background-color: #5B55C8;
            box-shadow: inset 0 0 0 3px white;
        }
    </style>
    <style>

            <a href="Pago completo.html" onclick="event.preventDefault(); goTo('Pago completo.html')" class="block">

                    Pagar

    </div>
    <script>
        function goTo(url) {
            document.body.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 200);
        }
    </script>
