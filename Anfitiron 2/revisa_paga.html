<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>Revisa y paga JOM Mobile Final</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#5B55C8",
                        "neutral-text": "#1F2937",
                        "gray-subtext": "#6B7280",
                        "border-light": "#E5E7EB",
                    },
                    fontFamily: {
                        sans: ["Inter", "sans-serif"],
                    },
                },
            },
        };
    </script>
    <style type="text/tailwindcss">
        body {
  animation: page-enter 200ms ease;
}

.page-exit {
  animation: page-exit 200ms ease forwards;
}

@keyframes page-enter {
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

@keyframes page-exit {
  from { opacity: 1; transform: translateY(0); }
  to   { opacity: 0; transform: translateY(-8px); }
}

        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .safe-area-bottom {
            padding-bottom: calc(16px + env(safe-area-inset-bottom));
        }
        .icon-fill-purple {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            color: #5B55C8;
        }
    </style>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-white text-neutral-text antialiased flex flex-col min-h-screen">
    <header
        class="flex items-center justify-between px-4 h-[56px] border-b border-border-light bg-white sticky top-0 z-50">
        <button class="w-10 h-10 flex items-center justify-start text-gray-900">
            <span class="material-symbols-outlined">close</span>
        </button>
        <h2 class="text-[16px] font-semibold text-gray-900 flex-1 text-center">Revisa y paga</h2>
        <div class="w-10"></div>
    </header>
    <main class="flex-1 px-4 py-6">
        <div class="max-w-md mx-auto">
            <div class="border border-border-light rounded-[16px] bg-white p-4 space-y-4">
                <div class="flex items-start gap-4">
                    <div class="w-[100px] h-[100px] rounded-[12px] overflow-hidden flex-shrink-0">
                        <img alt="Dpto. a estrenar en Asuncion" class="w-full h-full object-cover"
                            src="https://lh3.googleusercontent.com/aida-public/AB6AXuBpQvaOPWTIrZR2nB8erFVQt3e7NkZiU7PJH8Di7ag637_UPI0fl0SIt85G5wljJg-a9jRn_zCNg770c4zzD78jr9vnPaVpU-Px0xqZ3P6uKT-pNxWC6SmXRvSVyTMU7sAmj9WVT0qDMaIEQzZl0lcXTnzm-eQWmJmS4URTygvzt7_ukF7mX0kjt2-dnnRnK9011ZyStJe-z3nl063DYrup66tiQ5PysGM9b2ZtFmlyXE6MKGkek5PHvJRS0v1cwqPoEHnEDqC3O7Y" />
                    </div>
                    <div class="flex flex-col pt-1">
                        <h3 class="text-[20px] font-semibold text-gray-900 leading-[1.2]">Apartamento simpático -
                            Cochabamba, Bolivia
                        </h3>
                        <div class="flex items-center gap-1 mt-1">
                            <span class="material-symbols-outlined text-[18px] icon-fill-purple">star</span>
                            <span class="text-[14px] font-medium text-gray-900">4.85 (26)</span>
                        </div>
                    </div>
                </div>
                <div class="h-[1px] bg-border-light w-full"></div>
                <div>
                    <h3 class="text-[20px] font-semibold text-gray-900">Fechas</h3>
                    <p class="text-[16px] text-gray-subtext mt-1">6 - 8 de feb de 2026</p>
                </div>
                <div class="h-[1px] bg-border-light w-full"></div>
                <div>
                    <h3 class="text-[20px] font-semibold text-gray-900">Huéspedes</h3>
                    <p class="text-[16px] text-gray-subtext mt-1">1 adulto</p>
                </div>
                <div class="h-[1px] bg-border-light w-full"></div>
                <div>
                    <h3 class="text-[20px] font-semibold text-gray-900">Precio total</h3>
                    <p class="text-[20px] font-bold text-gray-900 mt-1">800 BOB</p>
                </div>
                <div class="h-[1px] bg-border-light w-full"></div>
                <div class="space-y-1">
                    <h3 class="text-[20px] font-semibold text-gray-900">Cancelación gratuita</h3>
                    <p class="text-[16px] text-gray-subtext leading-[1.5]">
                        Si cancelas la reservación antes del 5 de febrero recibirás un reembolso total.
                        <a class="text-primary font-semibold" href="#">Política completa</a>
                    </p>
                </div>
            </div>
        </div>
    </main>
    <footer class="w-full border-t border-border-light bg-white sticky bottom-0 z-50">
        <a href="metodo_pago.html" onclick="event.preventDefault(); goTo('metodo_pago.html')" class="block">
            <div class="max-w-md mx-auto px-4 py-4 safe-area-bottom flex gap-3">
                <button
                    class="flex-1 h-[48px] bg-white border border-border-light rounded-[12px] font-semibold text-gray-900 active:bg-gray-50 transition-colors">
                    Cancelar
                </button>
                <button
                    class="flex-1 h-[48px] bg-primary rounded-[12px] font-semibold text-white active:opacity-90 transition-opacity">
                    Siguiente
                </button>
            </div>
        </a>
    </footer>
    <script>
        function goTo(url) {
            document.body.classList.add('page-exit');
            setTimeout(() => {
                window.location.href = url;
            }, 200);
        }
    </script>


</body>

</html>
