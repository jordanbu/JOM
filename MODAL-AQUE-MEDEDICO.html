<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>JOM Edit Profile Info Modal</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5B55C8",
                        "primary-hover": "#4a45b0",
                        "background-light": "#f6f6f8",
                        "background-dark": "#14141e",
                        "jom-gray-900": "#1f2937",
                        "jom-gray-800": "#374151",
                        "jom-gray-700": "#4B5563",
                        "jom-gray-600": "#4B5563",
                        "jom-gray-500": "#6b7280",
                        "jom-gray-400": "#9CA3AF",
                        "jom-gray-300": "#D1D5DB",
                        "jom-gray-200": "#e5e7eb",
                        "jom-gray-100": "#F3F4F6",
                        "jom-gray-50": "#f8f9fc",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "modal": "16px",
                        "jom-modal": "16px",
                        "jom-input": "12px",
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark font-display min-h-screen flex items-center justify-center p-4">
    <div class="fixed inset-0 bg-black/10 dark:bg-black/40 backdrop-blur-xl"></div>
    <div class="relative w-full max-w-[440px] bg-white dark:bg-zinc-900 rounded-modal shadow-2xl z-10 overflow-hidden">
        <div class="absolute right-2 top-2">
            <button
                class="w-11 h-11 flex items-center justify-center text-jom-gray-500 dark:text-zinc-400 hover:bg-jom-gray-50 dark:hover:bg-zinc-800 rounded-full transition-all duration-200">
                <span class="material-symbols-outlined text-[24px]">close</span>
            </button>
        </div>
        <div class="p-6">
            <div class="text-center mb-4">
                <h2 class="text-jom-gray-900 dark:text-white text-lg font-semibold leading-tight">¿A qué te dedicas?</h2>
            </div>
            <div class="mb-4">
                <p class="text-jom-gray-500 dark:text-zinc-400 text-sm font-normal leading-relaxed text-center">
                    Cuéntanos cuál es tu profesión. Si no tienes un trabajo tradicional, háblanos acerca de lo que haces
                    en la vida.
                </p>
            </div>
            <div class="space-y-2">
                <input
                    class="block w-full h-[44px] px-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white text-base placeholder:text-jom-gray-500 dark:placeholder:text-zinc-400 focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200 outline-none"
                    type="text" value="front end" />
                <p class="text-right text-jom-gray-500 dark:text-zinc-400 text-xs">
                    11 caracteres disponibles
                </p>
            </div>
            <div class="mt-4 flex justify-end">
                <button
                    class="px-8 h-12 bg-primary hover:bg-primary-hover text-white text-base font-semibold rounded-jom-input transition-all duration-200 shadow-sm active:scale-[0.98]">
                    Guardar
                </button>
            </div>
        </div>
    </div>

</body>

</html>
