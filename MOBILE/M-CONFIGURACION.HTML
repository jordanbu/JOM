    <style type="text/tailwindcss">
        @layer base {
            body {
                font-family: 'Inter', sans-serif;

            }
        }
        .max-content-width {

        .dropdown-item {

            font-weight: 500;
            transition: all 0.2s ease;
            cursor: pointer;
            color: #1F2937;
            gap: 12px;
            border-left: 3px solid transparent;
        }
        .dropdown-item:hover {

        .info-item {

            margin-bottom: 0;
            background: white;
        }
        @media (min-width: 768px) {
            .info-item {
                padding: 24px 0;
            }
        }
        .info-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }
        .accordion-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease, padding 0.3s ease;
            padding-top: 0;
        }
        .accordion-content.active {
            max-height: 500px;
            padding-top: 16px;
            border-top: 1px solid #E5E7EB;
            margin-top: 16px;
        }
        .accordion-button {
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .accordion-button:hover {
            color: #4A45B0;
        }
        .accordion-button .material-symbols-outlined {
            transition: transform 0.3s ease;
        }
        .accordion-button.active .material-symbols-outlined {
            transform: rotate(180deg);
        }
    </style>
    <script>
        function toggleAccordion(button) {
            const content = button.closest('.info-item').querySelector('.accordion-content');
            const isActive = button.classList.contains('active');
            
            // Close all accordions
            document.querySelectorAll('.accordion-button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.accordion-content').forEach(cnt => {
                cnt.classList.remove('active');
            });
            
            // Toggle current accordion
            if (!isActive) {
                button.classList.add('active');
                content.classList.add('active');
            }
        }
    </script>
