<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport" />
    <title>JOM | Registrarse</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5B55C8",
                        "primary-hover": "#4a45b0",
                        "jom-gold": "#FDB022",
                        "background-light": "#f6f6f8",
                        "background-dark": "#14141e",
                        "success": "#16A34A",
                        "jom-gray-900": "#1F2937",
                        "jom-gray-800": "#374151",
                        "jom-gray-700": "#4B5563",
                        "jom-gray-600": "#6B7280",
                        "jom-gray-500": "#6B7280",
                        "jom-gray-400": "#9CA3AF",
                        "jom-gray-300": "#D1D5DB",
                        "jom-gray-200": "#E5E7EB",
                        "jom-gray-100": "#F3F4F6",
                        "jom-gray-50": "#F8F9FC",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "16px",
                        "xl": "1.5rem",
                        "jom-input": "12px",
                    },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .bg-pattern {
            background-color: #f6f6f8;
            background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .dark .bg-pattern {
            background-color: #14141e;
            background-image: radial-gradient(#2d2d3d 1px, transparent 1px);
        }

        * {
            -webkit-tap-highlight-color: transparent;
        }

        @keyframes slideUp {
            from {
                transform: translateY(100%);
            }
            to {
                transform: translateY(0);
            }
        }

        .animate-slide-up {
            animation: slideUp 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body class="font-display min-h-screen relative overflow-hidden bg-pattern">
    <div class="fixed inset-0 z-0 flex items-center justify-center p-8 pointer-events-none">
        <div class="absolute top-1/4 left-1/4 w-48 h-48 bg-primary/20 rounded-full blur-3xl"></div>
        <div class="absolute bottom-1/4 right-1/4 w-64 h-64 bg-primary/10 rounded-full blur-3xl"></div>
    </div>
    <div class="fixed inset-0 z-10 backdrop-blur-xl bg-black/10 dark:bg-black/40"></div>
    <div class="fixed inset-0 z-20 flex items-end sm:items-center justify-center">
        <div class="relative w-full sm:max-w-[440px] bg-white dark:bg-zinc-900 sm:rounded-lg rounded-t-[24px] shadow-2xl overflow-hidden animate-slide-up">
            <div class="absolute right-2 top-2 z-10">
                <button
                    class="w-11 h-11 flex items-center justify-center text-jom-gray-500 hover:bg-jom-gray-50 dark:hover:bg-zinc-800 rounded-full transition-colors active:scale-90">
                    <span class="material-symbols-outlined text-[24px]">close</span>
                </button>
            </div>
            <div class="px-6 sm:px-8 py-8 sm:py-6 flex flex-col items-center max-h-screen overflow-y-auto">
                <div
                    class="w-12 h-12 bg-jom-gray-50 dark:bg-zinc-800 rounded-full flex items-center justify-center mb-6 mt-2">
                    <span class="material-symbols-outlined text-jom-gray-500 text-[24px]">person_add</span>
                </div>
                <div class="text-center mb-8">
                    <h1 class="text-jom-gray-900 dark:text-white text-[24px] sm:text-[28px] font-semibold leading-tight">
                        ¡Únete a JoM!
                    </h1>
                    <p class="text-jom-gray-500 dark:text-zinc-400 text-sm sm:text-base font-normal mt-1">
                        Crea tu cuenta y comienza a reservar
                    </p>
                </div>
                <form class="w-full" onsubmit="return false;">
                    <div class="space-y-4">
                        <!-- Nombre -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Nombre</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">person</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Nombre" type="text" required />
                            </div>
                        </div>
                        
                        <!-- Apellido -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Apellido</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">badge</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Apellido" type="text" required />
                            </div>
                        </div>
                        
                        <!-- Correo electrónico -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Correo electrónico</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">mail</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Correo electrónico" type="email" required />
                            </div>
                        </div>
                        
                        <!-- Número de teléfono -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Número de teléfono</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">phone</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Número de teléfono" type="tel" required />
                            </div>
                        </div>
                        
                        <!-- Contraseña -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Contraseña</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">lock</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-11 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Contraseña" type="password" required />
                                <div
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Confirmar Contraseña -->
                        <div class="flex flex-col gap-1.5">
                            <label class="sr-only">Confirmar contraseña</label>
                            <div class="relative group">
                                <div
                                    class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">lock_reset</span>
                                </div>
                                <input
                                    class="block w-full h-[48px] sm:h-[44px] pl-11 pr-11 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 focus:ring-2 focus:ring-primary focus:border-primary transition-all outline-none text-base"
                                    placeholder="Confirmar contraseña" type="password" required />
                                <div
                                    class="absolute inset-y-0 right-0 pr-3 flex items-center cursor-pointer text-jom-gray-500">
                                    <span class="material-symbols-outlined text-[20px]">visibility</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-6">
                        <button
                            class="w-full h-[52px] sm:h-12 bg-primary hover:bg-primary-hover text-white font-semibold rounded-jom-input transition-colors duration-200 shadow-sm active:scale-[0.98] text-base"
                            type="submit">
                            Crear cuenta
                        </button>
                    </div>
                </form>
                <div class="w-full flex items-center gap-4 my-6">
                    <div class="flex-grow h-[1px] bg-jom-gray-200 dark:bg-zinc-700"></div>
                    <span class="text-[14px] text-jom-gray-500 dark:text-zinc-500 font-normal">o</span>
                    <div class="flex-grow h-[1px] bg-jom-gray-200 dark:bg-zinc-700"></div>
                </div>
                <button
                    class="w-full h-[52px] sm:h-12 flex items-center justify-center gap-3 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-colors duration-200 active:scale-[0.98] text-base">
                    <svg height="18" viewBox="0 0 18 18" width="18">
                        <path
                            d="M17.64 9.20455C17.64 8.56636 17.5827 7.95273 17.4764 7.36364H9V10.845H13.8436C13.635 11.97 13.0009 12.9232 12.0477 13.5614V15.8195H14.9564C16.6582 14.2527 17.64 11.9455 17.64 9.20455Z"
                            fill="#4285F4"></path>
                        <path
                            d="M9 18C11.43 18 13.4673 17.1941 14.9564 15.8195L12.0477 13.5614C11.2418 14.1014 10.2109 14.4205 9 14.4205C6.65591 14.4205 4.67182 12.8373 3.96409 10.71H0.957275V13.0418C2.43818 15.9832 5.48182 18 9 18Z"
                            fill="#34A853"></path>
                        <path
                            d="M3.96409 10.71C3.78409 10.17 3.68182 9.59318 3.68182 9C3.68182 8.40682 3.78409 7.83 3.96409 7.29V4.95818H0.957275C0.347727 6.17318 0 7.54773 0 9C0 10.4523 0.347727 11.8268 0.957275 13.0418L3.96409 10.71Z"
                            fill="#FBBC05"></path>
                        <path
                            d="M9 3.57955C10.3214 3.57955 11.5077 4.03364 12.4405 4.92545L15.0218 2.34409C13.4632 0.891818 11.4259 0 9 0C5.48182 0 2.43818 2.01682 0.957275 4.95818L3.96409 7.29C4.67182 5.16273 6.65591 3.57955 9 3.57955Z"
                            fill="#EA4335"></path>
                    </svg>
                    <span class="text-jom-gray-900 dark:text-white font-medium">Continuar con Google</span>
                </button>
                <div class="mt-8 mb-2 text-center">
                    <p class="text-[14px] text-jom-gray-500 dark:text-zinc-400">
                        ¿Ya tienes una cuenta?
                        <a class="text-primary font-semibold hover:underline transition-all" href="#">Inicia sesión</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

</body>

</html>
