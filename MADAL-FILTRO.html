<!DOCTYPE html>
<html class="light" lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Official JOM Filters Modal Design</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#5B55C8",
                        "primary-hover": "#4a45b0",
                        "jom-gold": "#FDB022",
                        "background-light": "#f6f6f8",
                        "background-dark": "#14141e",
                        "success": "#16A34A",
                        "jom-gray-900": "#1F2937",
                        "jom-gray-800": "#374151",
                        "jom-gray-700": "#4B5563",
                        "jom-gray-600": "#6B7280",
                        "jom-gray-500": "#6B7280",
                        "jom-gray-400": "#9CA3AF",
                        "jom-gray-300": "#D1D5DB",
                        "jom-gray-200": "#E5E7EB",
                        "jom-gray-100": "#F3F4F6",
                        "jom-gray-50": "#F8F9FC",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "16px",
                        "xl": "1.5rem",
                        "jom-modal": "16px",
                        "jom-input": "12px",
                    },
                },
            },
        }
    </script>
    <style type="text/tailwindcss">
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #9ca3af;
            border-radius: 10px;
        }
    </style>
</head>

<body class="font-display min-h-screen flex items-center justify-center bg-background-light dark:bg-background-dark">
    <div class="fixed inset-0 bg-black/10 dark:bg-black/40 backdrop-blur-xl transition-all"></div>
    <div
        class="relative w-full max-w-[640px] h-[90vh] bg-white dark:bg-zinc-900 rounded-jom-modal shadow-2xl flex flex-col z-10 overflow-hidden">
        <div class="relative px-6 py-6 border-b border-jom-gray-200 dark:border-zinc-700 flex items-center justify-center">
            <h1 class="text-jom-gray-900 dark:text-white text-[20px] font-semibold">Filtros</h1>
            <button
                class="absolute right-6 top-1/2 -translate-y-1/2 w-11 h-11 flex items-center justify-center text-jom-gray-500 hover:bg-jom-gray-50 dark:hover:bg-zinc-800 rounded-full transition-colors">
                <span class="material-symbols-outlined text-[24px]">close</span>
            </button>
        </div>
        <div class="flex-1 overflow-y-auto custom-scrollbar px-10 py-8">
            <div class="flex flex-col gap-16">
                <section>
                    <h2 class="text-jom-gray-900 dark:text-white text-[18px] font-semibold mb-6">Rango de precios</h2>
                    <div class="grid grid-cols-2 gap-6">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-medium text-jom-gray-500 dark:text-zinc-400">Mínimo</label>
                            <div
                                class="relative flex items-center h-[44px] px-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
                                <span class="text-[16px] font-semibold text-jom-gray-900 dark:text-white mr-2">BOB</span>
                                <input
                                    class="w-full bg-transparent border-none p-0 focus:ring-0 text-[16px] text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 dark:placeholder:text-zinc-500"
                                    placeholder="150" type="number" value="150" />
                            </div>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-medium text-jom-gray-500 dark:text-zinc-400">Máximo</label>
                            <div
                                class="relative flex items-center h-[44px] px-4 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 rounded-jom-input focus-within:ring-2 focus-within:ring-primary/20 focus-within:border-primary transition-all">
                                <span class="text-[16px] font-semibold text-jom-gray-900 dark:text-white mr-2">BOB</span>
                                <input
                                    class="w-full bg-transparent border-none p-0 focus:ring-0 text-[16px] text-jom-gray-900 dark:text-white placeholder:text-jom-gray-500 dark:placeholder:text-zinc-500"
                                    placeholder="250" type="number" value="250" />
                            </div>
                        </div>
                    </div>
                </section>
                <section>
                    <h2 class="text-jom-gray-900 dark:text-white text-[18px] font-semibold mb-6">Habitaciones y camas</h2>
                    <div class="bg-jom-gray-50 dark:bg-zinc-800 rounded-jom-modal p-6 space-y-6">
                        <div class="flex items-center justify-between">
                            <span class="text-[16px] font-medium text-jom-gray-900 dark:text-white">Habitaciones</span>
                            <div class="flex items-center gap-4">
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-white dark:bg-zinc-900 border border-jom-gray-200 dark:border-zinc-700 text-jom-gray-900 dark:text-white hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-colors duration-200">
                                    <span class="material-symbols-outlined text-[20px]">remove</span>
                                </button>
                                <span class="text-[16px] font-semibold text-jom-gray-900 dark:text-white min-w-[24px] text-center">0</span>
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-hover transition-colors duration-200 shadow-sm active:scale-[0.98]">
                                    <span class="material-symbols-outlined text-[20px]">add</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[16px] font-medium text-jom-gray-900 dark:text-white">Camas</span>
                            <div class="flex items-center gap-4">
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-white dark:bg-zinc-900 border border-jom-gray-200 dark:border-zinc-700 text-jom-gray-900 dark:text-white hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-colors duration-200">
                                    <span class="material-symbols-outlined text-[20px]">remove</span>
                                </button>
                                <span class="text-[16px] font-semibold text-jom-gray-900 dark:text-white min-w-[24px] text-center">0</span>
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-hover transition-colors duration-200 shadow-sm active:scale-[0.98]">
                                    <span class="material-symbols-outlined text-[20px]">add</span>
                                </button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-[16px] font-medium text-jom-gray-900 dark:text-white">Baños</span>
                            <div class="flex items-center gap-4">
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-white dark:bg-zinc-900 border border-jom-gray-200 dark:border-zinc-700 text-jom-gray-900 dark:text-white hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-colors duration-200">
                                    <span class="material-symbols-outlined text-[20px]">remove</span>
                                </button>
                                <span class="text-[16px] font-semibold text-jom-gray-900 dark:text-white min-w-[24px] text-center">0</span>
                                <button
                                    class="w-[32px] h-[32px] flex items-center justify-center rounded-full bg-primary text-white hover:bg-primary-hover transition-colors duration-200 shadow-sm active:scale-[0.98]">
                                    <span class="material-symbols-outlined text-[20px]">add</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
                <section>
                    <h2 class="text-jom-gray-900 dark:text-white text-[18px] font-semibold mb-6">Servicios</h2>
                    <div class="flex flex-wrap gap-3">
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Wi-Fi</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">TV</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Ducha</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Ventilador</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border-2 border-primary bg-jom-purple-light dark:bg-primary/20 text-primary dark:text-primary font-semibold transition-all duration-200 text-[14px]">Agua Caliente</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Calefacción</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Papel Higiénico</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Jabón</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Toallas</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Almohadas</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Cocina Equipada</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Refrigerador</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Cafetera</button>
                        <button
                            class="px-6 py-2.5 rounded-jom-input border border-jom-gray-200 dark:border-zinc-700 bg-white dark:bg-zinc-800 text-jom-gray-500 dark:text-zinc-400 font-medium hover:border-primary/50 hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-all duration-200 text-[14px]">Utensilios</button>
                    </div>
                </section>
            </div>
        </div>
        <div class="px-6 py-4 border-t border-jom-gray-200 dark:border-zinc-700 flex items-center justify-between bg-white dark:bg-zinc-900">
            <button class="h-12 px-8 bg-white dark:bg-zinc-800 border border-jom-gray-200 dark:border-zinc-700 text-jom-gray-900 dark:text-white text-[16px] font-semibold rounded-jom-input hover:bg-jom-gray-50 dark:hover:bg-zinc-700 transition-colors duration-200">
                Limpiar todo
            </button>
            <button
                class="h-12 px-8 bg-primary hover:bg-primary-hover text-white text-[16px] font-semibold rounded-jom-input transition-colors duration-200 shadow-sm active:scale-[0.98]">
                Mostrar resultados
            </button>
        </div>
    </div>

</body>

</html>
